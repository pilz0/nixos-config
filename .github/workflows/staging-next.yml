name: Update staging-next branch
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: DeterminateSystems/determinate-nix-action@main
      - name: Pin nixpkgs to staging-next and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B staging-next
          nix flake lock --override-input nixpkgs github:nixos/nixpkgs/staging-next
          git commit -am "flake.lock: pin nixpkgs to staging-next"
          git push --force origin staging-next
