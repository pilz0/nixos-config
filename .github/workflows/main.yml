name: Build and push Darwin configuration
on:
  push:
    branches: [main]

jobs:
  build-and-p:
    name: Build and darwin config
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@main

      - name: Clean up macOS runner storage
        shell: bash
        run: |
          set -euxo pipefail

          # Show disk usage before cleanup
          df -h /

          # Remove unused iOS/watchOS/tvOS simulator data
          xcrun simctl delete unavailable || true

          # Remove common Xcode build artifacts and caches
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Developer/Xcode/Archives/*
          rm -rf ~/Library/Developer/Xcode/Products/*

          # Remove Swift Package Manager caches
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

          # Remove CocoaPods cache, if unused afterward
          pod cache clean --all || true

          # Remove Homebrew cache
          brew cleanup -s || true
          rm -rf "$(brew --cache)" || true

          # Show disk usage after cleanup
          df -h /

      - name: Inspect runner storage
        run: |
          df -h /
          du -sh "$HOME"/* 2>/dev/null | sort -h
          du -sh "$HOME/Library"/* 2>/dev/null | sort -h

      - name: build and push darwin config
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GHA_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          ssh-keyscan cache.kyouma.net >> ~/.ssh/known_hosts
          nix build .#darwinConfigurations.magbook.config.system.build.toplevel --accept-flake-config 
          nix copy --to ssh://nix-ssh@cache.kyouma.net .#darwinConfigurations.magbook.config.system.build.toplevel --accept-flake-config
